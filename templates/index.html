<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dzongkha AI Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1>Dzongkha AI Chatbot</h1>
        <p class="subtitle">Ask in English &middot; Answers in Dzongkha (<span class="dz" lang="dz">རྫོང་ཁ</span>)</p>
      </div>
      <button id="clearBtn" class="btn btn-ghost" type="button" aria-label="Clear chat">Clear chat</button>
    </header>

    <div id="statusBanner" class="banner banner-info" role="status" hidden></div>
    <div class="banner banner-warn" role="note">
     <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Dzongkha AI Chatbot logo" class="logo">
    <main id="chat" class="chat" aria-live="polite" aria-label="Conversation"></main>

    <section class="examples" aria-label="Example questions">
      <span class="examples-label">Try:</span>
      <button class="chip" type="button">Hello, how are you?</button>
      <button class="chip" type="button">What is artificial intelligence?</button>
      <button class="chip" type="button">How can I learn Python?</button>
      <button class="chip" type="button">What is machine learning?</button>
      <button class="chip" type="button">Thank you for your help.</button>
    </section>

    <div id="errorBox" class="error" role="alert" hidden></div>

    <div class="composer">
      <label for="input" class="sr-only">Your message in English</label>
      <textarea id="input" rows="1" maxlength="500" placeholder="Type your question in English..."></textarea>
      <button id="sendBtn" class="btn btn-primary" type="button">Send</button>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
